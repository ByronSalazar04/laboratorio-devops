<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratorio DevOps</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #161b22;
      padding: 2.5rem;
      border-radius: 12px;
      border: 1px solid #30363d;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 450px;
    }
    h1 { color: #58a6ff; margin-bottom: 0.5rem; }
    h2 { color: #8b949e; font-weight: 400; margin-top: 0; }
    p { line-height: 1.6; }
    .badge {
      display: inline-block;
      background-color: #238636;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Laboratorio DevOps</h1>
    <h2>Desarrollo Web</h2>
    <p>Docker, Kubernetes y GitHub Actions</p>
    <p>Grupo: Byron Salazar y compañeros</p>
    <div class="badge">Despliegue Automático CI/CD Activo</div>
  </div>
</body>
</html>
